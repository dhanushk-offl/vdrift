[package]
name = "vdrift"
version = "0.1.0"
edition = "2024"
description = "Detect, propose, synchronize, and verify versions across your entire codebase. version drift shouldn't happen."
license = "MIT"
repository = "https://github.com/vdrift/vdrift"
keywords = ["version", "semver", "release", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde_yaml = "0.9"
semver = "1"
ignore = "0.4"
thiserror = "1"
dialoguer = "0.11"
dirs = "5"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
lto = true